id: prngs
name: Pseudo-Random Number Generators
description: Welcome to the world of Pseudo-random number generators, these are deterministic algorithms designed to produce sequences that look random, but their internal structure often makes them predictable when used incorrectly.
  In this module, you will study and attack several classic PRNG families, including Park-Miller LCGs, Mersenne Twisters, and xorshift-based generators, with a focus on state recovery,
  parameter recovery, and output prediction.


